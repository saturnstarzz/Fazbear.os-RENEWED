<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faz-Link Security Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            color: #22c55e;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(34, 197, 94, 0.1);
            position: absolute;
            top: 0;
            z-index: 101;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #14532d; }
        
        .nav-active { color: white !important; text-shadow: 0 0 8px white; border-color: white !important; }
        
        /* Animatronic Symbol Styling */
        .symbol-large {
            font-size: clamp(5rem, 15vw, 10rem);
            line-height: 1;
            transition: all 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="app" class="h-screen w-screen relative overflow-hidden"></div>

    <script type="module">
        import { h, render } from 'https://esm.sh/preact';
        import { useState, useEffect } from 'https://esm.sh/preact/hooks';
        import htm from 'https://esm.sh/htm';

        const html = htm.bind(h);
        const apiKey = ""; 

        const LOCATIONS = [
            { 
                id: 'sb', 
                name: 'Mega Pizzaplex', 
                era: 'Glamrock Generation',
                rooms: [
                    { id: 'ATRIUM', name: 'Main Atrium' },
                    { id: 'DAYCARE', name: 'Superstar Daycare' },
                    { id: 'RACE', name: 'Roxy Raceway' },
                    { id: 'GOLF', name: 'Monty Golf' },
                    { id: 'PARTS', name: 'Parts & Service' }
                ],
                animatronics: [
                    { id: 'freddy', name: 'Glamrock Freddy', color: '#f97316', icon: '👑', protocol: "Allied unit. Safe for pilot mode." },
                    { id: 'chica', name: 'Glamrock Chica', color: '#f472b6', icon: '💖', protocol: "Garbage attraction high. Deploy lure." },
                    { id: 'monty', name: 'Montgomery Gator', color: '#22c55e', icon: '🔥', protocol: "Aggressive jumping. High threat." },
                    { id: 'sun_moon', name: 'Daycare Attendant', dynamic: true }
                ]
            },
            { 
                id: 'fnaf1', 
                name: 'Fazbear\'s (1993)', 
                era: 'Legacy Branch',
                rooms: [
                    { id: '1A', name: 'Show Stage' },
                    { id: '1B', name: 'Dining Area' },
                    { id: '1C', name: 'Pirate Cove' },
                    { id: '2A', name: 'West Hall' },
                    { id: '4A', name: 'East Hall' }
                ],
                animatronics: [
                    { id: 'freddy', name: 'Freddy Fazbear', color: '#92400e', icon: '🐻', protocol: "Classic AI. Active in dark areas." },
                    { id: 'bonnie', name: 'Bonnie', color: '#1d4ed8', icon: '🎸', protocol: "West Hall specialist." },
                    { id: 'chica', name: 'Chica', color: '#eab308', icon: '🐥', protocol: "East Hall / Kitchen." },
                    { id: 'foxy', name: 'Foxy', color: '#ef4444', icon: '🦊', protocol: "Keep eyes on 1C." }
                ]
            }
        ];

        function App() {
            const [booted, setBooted] = useState(false);
            const [view, setView] = useState('menu');
            const [locIdx, setLocIdx] = useState(0);
            const [activeCam, setActiveCam] = useState('');
            const [battery, setBattery] = useState(100);
            const [time, setTime] = useState(12);
            const [roomLights, setRoomLights] = useState(false);
            const [positions, setPositions] = useState({});

            const activeLoc = LOCATIONS[locIdx];

            useEffect(() => {
                setTimeout(() => setBooted(true), 2000);
            }, []);

            useEffect(() => {
                const pos = {};
                activeLoc.animatronics.forEach(a => {
                    pos[a.id] = activeLoc.rooms[Math.floor(Math.random() * activeLoc.rooms.length)].id;
                });
                setPositions(pos);
                setActiveCam(activeLoc.rooms[0].id);
                setRoomLights(false);
            }, [locIdx]);

            useEffect(() => {
                if (!booted || battery <= 0) return;
                const interval = setInterval(() => {
                    let drain = 0.04;
                    if (view === 'cams') drain += 0.06;
                    if (roomLights) drain += 0.3;
                    setBattery(b => Math.max(0, b - drain));
                    
                    // Small chance to move AI
                    if (Math.random() > 0.9) {
                        const ids = Object.keys(positions);
                        const randomId = ids[Math.floor(Math.random() * ids.length)];
                        const randomRoom = activeLoc.rooms[Math.floor(Math.random() * activeLoc.rooms.length)].id;
                        setPositions(prev => ({ ...prev, [randomId]: randomRoom }));
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [booted, battery, view, roomLights, positions]);

            const getDaycareState = () => {
                return roomLights 
                    ? { name: 'Sundrop', color: '#fbbf24', icon: '☀️', protocol: "Lights ON. Entity is stable." }
                    : { name: 'Moondrop', color: '#4f46e5', icon: '🌙', protocol: "Lights OFF. Entity is hostile." };
            };

            if (!booted) return html`
                <div class="h-full flex flex-col items-center justify-center p-6 text-center bg-black">
                    <div class="text-3xl animate-pulse tracking-[0.4em] mb-4 text-green-500 uppercase">Connecting...</div>
                    <div class="w-64 h-1 bg-zinc-900 overflow-hidden">
                        <div class="h-full bg-green-500 animate-[width_2s_linear]" style="width:100%"></div>
                    </div>
                </div>
            `;

            if (battery <= 0) return html`
                <div class="h-full flex flex-col items-center justify-center text-red-600 bg-black p-6 text-center">
                    <div class="text-6xl font-black italic mb-2">SYSTEM DEAD</div>
                    <div class="text-sm uppercase tracking-widest opacity-50 mb-10">Power Core Depleted</div>
                    <button onClick=${() => window.location.reload()} class="border-2 border-red-600 px-10 py-4 font-bold hover:bg-red-600 hover:text-black transition-all">HARD RESET</button>
                </div>
            `;

            return html`
                <div class="h-full flex flex-col crt overflow-hidden relative">
                    <div class="scanline"></div>
                    
                    <!-- Top Bar -->
                    <header class="h-14 border-b border-green-900 flex items-center justify-between px-6 bg-black z-50 shrink-0">
                        <div class="flex items-center gap-4">
                            <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_8px_red]"></div>
                            <div class="text-xl font-bold tracking-tighter uppercase italic truncate">Faz-Link // ${activeLoc.name}</div>
                        </div>
                        <div class="flex gap-8 text-2xl font-black">
                            <span>${time}:00 AM</span>
                            <span class="${battery < 20 ? 'text-red-500 animate-pulse' : ''}">${Math.floor(battery)}%</span>
                        </div>
                    </header>

                    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                        <!-- Left Navigation -->
                        <nav class="order-2 md:order-1 h-16 md:h-auto md:w-20 border-t md:border-t-0 md:border-r border-green-900 flex md:flex-col justify-around md:justify-center items-center md:gap-12 bg-black z-50 shrink-0">
                            <button onClick=${() => setView('menu')} class="p-3 border-b-2 border-transparent transition-all ${view === 'menu' ? 'nav-active' : 'text-green-900'}">
                                <div class="text-[10px] font-bold uppercase">Nodes</div>
                            </button>
                            <button onClick=${() => setView('cams')} class="p-3 border-b-2 border-transparent transition-all ${view === 'cams' ? 'nav-active' : 'text-green-900'}">
                                <div class="text-[10px] font-bold uppercase">Cams</div>
                            </button>
                            <button onClick=${() => setView('data')} class="p-3 border-b-2 border-transparent transition-all ${view === 'data' ? 'nav-active' : 'text-green-900'}">
                                <div class="text-[10px] font-bold uppercase">Data</div>
                            </button>
                        </nav>

                        <!-- Main Screen Area -->
                        <main class="order-1 md:order-2 flex-1 relative bg-black overflow-hidden">
                            
                            ${view === 'menu' && html`
                                <div class="p-8 md:p-16 animate-in fade-in h-full overflow-y-auto">
                                    <h2 class="text-5xl md:text-8xl font-black uppercase italic mb-12 text-green-500">Node Hub</h2>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-4xl">
                                        ${LOCATIONS.map((l, i) => html`
                                            <button onClick=${() => { setLocIdx(i); setView('cams'); }} 
                                                class="p-8 border-2 transition-all ${locIdx === i ? 'border-green-400 bg-green-950/20 text-green-400 shadow-[0_0_15px_rgba(34,197,94,0.3)]' : 'border-green-900 text-green-900 hover:border-green-700'} text-left group">
                                                <div class="text-3xl font-bold uppercase group-hover:text-green-500">${l.name}</div>
                                                <div class="text-xs opacity-50 uppercase tracking-[0.3em] mt-2">${l.era}</div>
                                            </button>
                                        `)}
                                    </div>
                                </div>
                            `}

                            ${view === 'cams' && html`
                                <div class="h-full flex flex-col lg:flex-row overflow-hidden">
                                    <div class="flex-1 relative flex flex-col items-center justify-center transition-colors duration-700 ${roomLights ? 'bg-zinc-800' : 'bg-black'}">
                                        
                                        <!-- Room UI -->
                                        <div class="absolute top-6 left-6 z-20 bg-black/90 border-2 border-green-900 p-4 shadow-2xl">
                                            <div class="text-4xl md:text-6xl font-black text-green-400 italic leading-none">${activeCam}</div>
                                            <div class="text-xs uppercase opacity-40 mt-1">${activeLoc.rooms.find(r => r.id === activeCam)?.name}</div>
                                        </div>

                                        <!-- Light Toggle -->
                                        <button onClick=${() => setRoomLights(!roomLights)} 
                                            class="absolute top-6 right-6 z-20 border-2 px-6 py-3 uppercase font-bold text-sm transition-all active:scale-95 ${roomLights ? 'bg-yellow-400 border-yellow-200 text-black shadow-[0_0_20px_rgba(250,204,21,0.4)]' : 'border-green-900 text-green-900 bg-black/60'}">
                                            Light: ${roomLights ? 'ON' : 'OFF'}
                                        </button>

                                        <!-- Animatronic Presence -->
                                        <div class="flex flex-wrap gap-16 items-center justify-center p-12 relative z-10 w-full">
                                            ${activeLoc.animatronics.filter(a => positions[a.id] === activeCam).map(a => {
                                                const s = a.dynamic ? getDaycareState() : a;
                                                return html`
                                                    <div class="flex flex-col items-center transition-all duration-1000 ${roomLights ? 'opacity-100 scale-100' : 'opacity-10 grayscale blur-sm scale-75 animate-pulse'}">
                                                        <div class="symbol-large mb-4 drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]" style="color: ${s.color}">${s.icon}</div>
                                                        <div class="text-xs font-bold uppercase tracking-[0.4em] border-2 py-1 px-4 bg-black/80" style="color: ${s.color}; border-color: ${s.color}">
                                                            ${s.name}
                                                        </div>
                                                    </div>
                                                `;
                                            })}
                                            ${activeLoc.animatronics.filter(a => positions[a.id] === activeCam).length === 0 && html`
                                                <div class="text-green-900/10 text-7xl md:text-[10rem] font-black italic text-center select-none pointer-events-none">NO SIGNAL</div>
                                            `}
                                        </div>
                                        
                                        <!-- HUD Overlays -->
                                        <div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_200px_rgba(0,0,0,1)] z-0"></div>
                                        <div class="absolute inset-0 pointer-events-none border-[40px] border-black/20 z-0"></div>
                                    </div>

                                    <!-- Camera Selector -->
                                    <div class="lg:w-72 border-t lg:border-t-0 lg:border-l border-green-900 p-6 bg-black overflow-x-auto lg:overflow-y-auto shrink-0 shadow-2xl">
                                        <div class="text-xs font-bold uppercase tracking-[0.5em] text-green-900 mb-6 hidden lg:block">Camera Matrix</div>
                                        <div class="flex lg:grid lg:grid-cols-2 gap-3">
                                            ${activeLoc.rooms.map(r => html`
                                                <button onClick=${() => setActiveCam(r.id)} 
                                                    class="min-w-[100px] lg:min-w-0 p-4 border-2 font-black text-xs transition-all active:scale-90 ${activeCam === r.id ? 'bg-green-900 border-green-400 text-white shadow-[0_0_10px_green]' : 'border-green-900 text-green-900 hover:border-green-700'}">
                                                    ${r.id}
                                                </button>
                                            `)}
                                        </div>
                                    </div>
                                </div>
                            `}

                            ${view === 'data' && html`
                                <div class="p-8 md:p-16 animate-in fade-in h-full overflow-y-auto max-w-5xl">
                                    <h2 class="text-5xl md:text-7xl font-black uppercase italic mb-10 text-green-500">Asset Data</h2>
                                    <div class="space-y-6">
                                        ${activeLoc.animatronics.map(a => {
                                            const s = a.dynamic ? getDaycareState() : a;
                                            return html`
                                                <div class="border-2 border-green-900/50 p-6 flex items-center gap-8 bg-zinc-950/50 transition-all hover:bg-zinc-900/50">
                                                    <div class="text-6xl shrink-0" style="color: ${s.color}">${s.icon}</div>
                                                    <div>
                                                        <div class="font-black text-3xl uppercase italic mb-1" style="color: ${s.color}">${s.name}</div>
                                                        <div class="text-sm text-green-800 font-bold uppercase tracking-widest opacity-80">
                                                            Protocol: <span class="text-green-600">"${s.protocol || a.protocol}"</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        })}
                                    </div>
                                </div>
                            `}
                        </main>
                    </div>

                    <!-- Footer Info -->
                    <footer class="h-8 bg-black border-t border-green-900 flex items-center justify-between px-6 text-[10px] uppercase tracking-[0.4em] font-bold text-green-900 shrink-0">
                        <div class="truncate mr-8">Network_${activeLoc.id.toUpperCase()} // Local Access Authorized</div>
                        <div class="animate-pulse hidden sm:block">Faz-Connect v4.2.0</div>
                    </footer>
                </div>
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
